<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager - Matte Dark UI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/motion@11.11.13/dist/motion.js"></script>
</head>
<body>
    
    <div class="app-layout">
        <!-- Left Sidebar (Fixed) -->
        {% if current_user.is_authenticated %}
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="profile-dropdown">
                    <img class="avatar" src="https://ui-avatars.com/api/?name=Nishanth+Chennupati&background=1c1c1c&color=ffffff&rounded=true" alt="Avatar">
                    <span class="profile-name">Nishanth Chennupati</span>
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
                </div>
                
                <div class="search-container">
                    <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
                    <input type="text" id="searchInput" class="search-input" placeholder="Search..." autocomplete="off">
                </div>
            </div>

            <div class="sidebar-scroll">
                <div class="sidebar-section">
                    <h3 class="section-title">WORKSPACE</h3>
                    <a href="{{ url_for('routes.index') }}" class="sidebar-item active">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4z"/></svg> All Tasks
                    </a>
                    <a href="#" class="sidebar-item">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/></svg> Templates
                    </a>
                    <a href="#" class="sidebar-item">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 2 7 12 12 22 7 12 2"/></svg> Pipelines
                    </a>
                </div>

                <div class="sidebar-section">
                    <h3 class="section-title">COMMUNITY</h3>
                    <a href="{{ url_for('routes.completed') }}" class="sidebar-item">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg> Completed
                    </a>
                    <a href="{{ url_for('routes.metrics') }}" class="sidebar-item">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg> Metrics
                    </a>
                    <a href="{{ url_for('routes.settings') }}" class="sidebar-item">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> Settings
                    </a>
                    {% if current_user.is_authenticated %}
                        <a href="{{ url_for('routes.logout') }}" class="sidebar-item" style="margin-top: 24px; color: #ff5555;">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg> Logout
                        </a>
                    {% endif %}
                </div>
            </div>
        </aside>
        {% endif %}

        <!-- Main Content Area -->
        <main class="main-content" id="mainContent">
            {% block content %}{% endblock %}
        </main>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
