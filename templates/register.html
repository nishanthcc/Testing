{% extends "base.html" %}
{% block content %}
<div class="auth-container">
    <div class="glass-card auth-card">
        <h2 class="display-title">REGISTER</h2>
        <form id="registerForm" class="auth-form">
            <input type="text" name="username" placeholder="Username" required class="glass-input">
            <input type="password" name="password" placeholder="Password" required class="glass-input">
            <button type="submit" class="cta-pill w-100">CREATE ↗</button>
        </form>
        <p class="auth-link">Already have an account? <a href="{{ url_for('routes.login') }}">Login</a></p>
    </div>
</div>
<script>
document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const formData = new FormData(e.target);
    const data = Object.fromEntries(formData.entries());
    const res = await fetch('{{ url_for("routes.register") }}', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
    });
    const json = await res.json();
    if (json.success) {
        window.location.href = json.redirect;
    } else {
        alert(json.message);
    }
});
</script>
{% endblock %}
