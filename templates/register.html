{% extends "base.html" %}

{% block content %}
<div class="centered-form-wrapper">
    <div class="auth-box">
        <h2 class="auth-title">Register</h2>
        <form id="registerForm" class="auth-form">
            <input type="text" name="username" placeholder="Username" required class="matte-input">
            <input type="password" name="password" placeholder="Password" required class="matte-input">
            <button type="submit" class="primary-btn w-100">Create Console Account</button>
        </form>
        <p class="auth-link">Existing account? <a href="{{ url_for('routes.login') }}">Login</a></p>
    </div>
</div>

<script>
document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const formData = new FormData(e.target);
    const data = Object.fromEntries(formData.entries());
    const res = await fetch('{{ url_for("routes.register") }}', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
    });
    const json = await res.json();
    if (json.success) {
        window.location.href = json.redirect;
    } else {
        alert(json.message);
    }
});
</script>
{% endblock %}
